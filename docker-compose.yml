name: obligarth

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: obligarth
      POSTGRES_USER: obligarth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set it in .env (install.sh generates one)}
    # Tuning sized for the push traffic of the former RMM agent (2000+ devices
    # ≈ 200 push/s, where stock Postgres collapsed under the device-table write
    # churn); kept until the load of the MDM is measured. Values below assume a
    # host with ~8GB RAM — scale shared_buffers≈25% and effective_cache_size≈75%
    # of host RAM. max_connections must stay above (server pool.max + session
    # pool + headroom); keep it in sync with knexfile.ts pool.max.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
      # Aggressive autovacuum, sized for the same former push traffic: hundreds
      # of row versions/s on the devices table made stock autovacuum fall
      # behind → bloat → every UI SELECT on devices slowed down. (A per-table
      # override on `devices` is set by migration 118 for even tighter thresholds.)
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.02"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.01"
      - "-c"
      - "autovacuum_vacuum_cost_delay=2ms"
      - "-c"
      - "autovacuum_naptime=15s"
      - "-c"
      - "autovacuum_max_workers=4"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Expose on LAN so you can run migrations from your PC / pgAdmin.
    # Remove this if you don't need external access.
    #ports:
    #  - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obligarth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  server:
    image: meejay/obligarth-server:${OBLIGARTH_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://obligarth:${DB_PASSWORD:?set it in .env (install.sh generates one)}@postgres:5432/obligarth
      SESSION_SECRET: ${SESSION_SECRET:?set it in .env to 32+ random characters (install.sh generates one)}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-obligarth.sid}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      # Public URL of this instance (e-mail links, trusted SSO origin) — see .env.example
      APP_URL: ${APP_URL:-}
      # Initial administrator — empty password: a random one, printed once in
      # the server logs. See .env.example.
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      # Proxies whose X-Forwarded-For entries are believed (client IP for audit,
      # 2FA "trust this IP"). Default: loopback + this container's own networks
      # + Docker's 172.16/12 pool. See .env.example.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-loopback, self, 172.16.0.0/12}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      # Device-bound 2FA (fingerprint validation from the Android app) — see .env.example
      DEVICE_KEYS_DISABLED: ${DEVICE_KEYS_DISABLED:-false}
      DEVICE_KEY_ORIGINS: ${DEVICE_KEY_ORIGINS:-}
      DEVICE_KEY_APP_IDS: ${DEVICE_KEY_APP_IDS:-}
      DEVICE_KEY_APP_SIGNERS: ${DEVICE_KEY_APP_SIGNERS:-}
      DEVICE_KEY_BINDING_SECRET: ${DEVICE_KEY_BINDING_SECRET:-}
      DEVICE_KEYS_SSO_ENABLED: ${DEVICE_KEYS_SSO_ENABLED:-false}
      # Obligate: optional distinct inbound secret (empty = Settings value / the API key) — see .env.example
      OBLIGATE_INBOUND_SECRET: ${OBLIGATE_INBOUND_SECRET:-}
      # Delegated reads from sibling apps (empty = oblidesk only, platform-admin subjects refused) — see .env.example
      OBLIGATE_DELEGATION_APPS: ${OBLIGATE_DELEGATION_APPS:-}
      OBLIGATE_DELEGATION_ALLOW_ADMIN: ${OBLIGATE_DELEGATION_ALLOW_ADMIN:-}
    volumes:
      # Persistent custom directory: reports, software repository, phone-key cache.
      - ${CUSTOM_DIR:-./custom}:/custom
    # Sized for the former RMM agent: 2000+ devices each held a persistent
    # WebSocket (1 fd) and the stock nofile soft limit (1024) starved Node.
    # Kept until the load of the MDM is measured.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072

  client:
    image: meejay/obligarth-client:${OBLIGARTH_VERSION:-latest}
    restart: unless-stopped
    # nginx worker_rlimit_nofile (65536) needs the container ulimit to allow it.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-3005}:80"
volumes:
  postgres_data:

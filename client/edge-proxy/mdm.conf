# edge-proxy of Obligarth: the TLS of the device surface (https://mdm.<domain>,
# the host of MDM_PUBLIC_BASE), with the ATS profile Apple devices require.
# Built into the console image (/etc/obligarth/edge-proxy/mdm.conf) and put in
# place of its server block by 40-obligarth-edge-proxy.sh when the container
# runs as the edge-proxy (docker-compose.yml): that script also creates the
# certificate when MDM_TLS_DIR gives none (self-signed, for a reverse proxy in
# front) and /etc/nginx/mdm-realip.conf (EDGE_TRUSTED_PROXIES).
#
# Routes, refused by default (404):
#   /t/<key>/checkin, /t/<key>/mdm, /t/<key>/scep    -> apple-edge (device listener)
#   /t/<key>/enroll|ade|byod|vpp...                  -> server (enrollment pages, Apps and Books notifications)
#   /a/<key>/byod, /a/<key>/signin...                -> server (Android: BYOD notice and code, sign-in URL)
#   /agent/v1/enroll|poll|inventory|icons, /agent/v1/packages/<sha256>
#                                                    -> server (Android bridge agents, agent-pont-android §4.1)
#   /healthz                                         -> apple-edge (watch it from outside)
# Never relayed: /internal/ (API of apple-edge, DDM relay of the server),
# the console and its API, nor a path that only normalizes into a route above
# (dot segments, encoded dots or slashes).
#
# Behind a reverse proxy (Oblihub, Nginx Proxy Manager...): http://<this container>:80
# on a shared Docker network, or https on MDM_LISTEN_PORT. The device's address is
# taken from its X-Forwarded-For when it comes from EDGE_TRUSTED_PROXIES
# (mdm-realip.conf). Behind an L4 proxy (TLS passthrough): your copy of this
# file with the PROXY protocol, mounted on /etc/obligarth/edge-proxy/mdm.conf
# by a compose override.

# Access log without the client address, the URI (tenant key, enrollment
# tokens, Android provisioningInfo, state and code of the sign-in URL) or the
# user agent.
log_format mdm_noip '$time_iso8601 $request_method $status $request_time $upstream_response_time $request_id';

# Docker's DNS: the upstreams follow the containers when they are recreated
# (new address), without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream apple_edge {
    zone apple_edge 64k;
    server apple-edge:9000 resolve;
    keepalive 64;
}

upstream obligarth_server {
    zone obligarth_server 64k;
    server server:3001 resolve;
    keepalive 16;
}

server {
    # Plain http for a reverse proxy that holds the TLS of the device host (Oblihub,
    # Nginx Proxy Manager...) and reaches this container on a Docker network:
    # never published by docker-compose.yml.
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/mdm/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/mdm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_conf_command SignatureAlgorithms ECDSA+SHA256:ECDSA+SHA384:RSA-PSS+SHA256:RSA-PSS+SHA384:RSA+SHA256:RSA+SHA384;
    ssl_session_tickets off;
    ssl_session_cache shared:mdm_tls:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/mdm-realip.conf;

    access_log /var/log/nginx/access.log mdm_noip;
    gzip off;
    client_body_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    # Overwrites any value sent by the client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # A client certificate is never relayed (DDM assets: step 3 of apple-edge).
    proxy_set_header Client-Cert "";

    # The locations below match the normalized URI, but proxy_pass relays the
    # request target as the client sent it: a path that only normalizes into
    # one of these routes (dot segments, encoded dots, slashes or backslashes)
    # would reach another route upstream (the console's API, its Socket.IO).
    # Refused, never relayed; the query string is not concerned.
    if ($request_uri ~ "^[^?]*(/\.\.?(/|\?|$)|%2[EeFf]|%5[Cc])") { return 404; }

    location ~ "^/t/[a-km-np-z2-9]{16}/checkin$" { client_max_body_size 4m;   proxy_read_timeout 20s; proxy_pass http://apple_edge; }
    location ~ "^/t/[a-km-np-z2-9]{16}/mdm$"     { client_max_body_size 16m;  proxy_read_timeout 35s; proxy_pass http://apple_edge; }
    location ~ "^/t/[a-km-np-z2-9]{16}/scep$"    { client_max_body_size 256k; proxy_read_timeout 15s; proxy_pass http://apple_edge; }
    location ~ "^/t/[a-km-np-z2-9]{16}/(enroll|ade|byod|vpp)(/|$)" { client_max_body_size 1m; proxy_pass http://obligarth_server; }
    location ~ "^/a/[a-km-np-z2-9]{16}/(byod|signin)(/|$)" { client_max_body_size 64k; proxy_pass http://obligarth_server; }
    # Android bridge agents (agent-pont-android §4.1): signed requests, the body relayed as is (never compressed).
    location ~ "^/agent/v1/(enroll|poll|inventory)$" { client_max_body_size 2m; proxy_read_timeout 30s; proxy_pass http://obligarth_server; }
    location = /agent/v1/icons { client_max_body_size 600k; proxy_read_timeout 30s; proxy_pass http://obligarth_server; }
    location ~ "^/agent/v1/packages/[0-9a-f]{64}$" { client_max_body_size 1k; proxy_read_timeout 120s; proxy_buffering off; proxy_pass http://obligarth_server; }
    location = /healthz { proxy_pass http://apple_edge; }
    location / { return 404; }
}

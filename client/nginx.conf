# conf.d/default.conf — included inside the http{} block of nginx-main.conf.
# `map` and `upstream` are http-context directives, valid here.

# WebSocket-aware Connection header. For an upgrade request (Socket.io, a
# module's WebSocket under /api) this yields "upgrade"; for a normal request
# it yields "" (empty), which is what lets nginx REUSE upstream keepalive
# connections instead of opening a fresh TCP+handshake per request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Content-Security-Policy of the console's pages (android-amapi §12.3, AN22; lot AN-E). Every page: no
# third-party site may frame the console (frame-ancestors, plus X-Frame-Options for older browsers), the console
# frames itself only, no plugin, no foreign <base>; scripts, styles, images and connections are not restricted here
# (no default-src). The pages that host a managed Google Play iframe, and the zero-touch portal, add Google's frames
# to frame-src, and only there. Matched on $request_uri: every SPA route is internally redirected to /index.html, so
# $uri no longer names the page. These values are CONSOLE_BASE_CSP and androidFrameCsp(CONSOLE_BASE_CSP) of
# shared/src/android/apps.ts and server/src/android/apps/framePolicy.ts: keep them identical (checked by the
# testbed). The console reloads the document when it reaches such a page by an in-app link (its policy is the one
# of the page first loaded). A CDN or a proxy in front must pass these headers unchanged.
map $request_uri $obligarth_csp {
    default "base-uri 'self'; object-src 'none'; frame-src 'self'; frame-ancestors 'self'";
    "~^/apps/android([?].*)?$" "base-uri 'self'; object-src 'none'; frame-src 'self' https://play.google.com https://enterprise.google.com; frame-ancestors 'self'";
    "~^/apps/android/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/managed-config([?].*)?$" "base-uri 'self'; object-src 'none'; frame-src 'self' https://play.google.com https://enterprise.google.com; frame-ancestors 'self'";
    "~^/policies/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/android/managed-config([?].*)?$" "base-uri 'self'; object-src 'none'; frame-src 'self' https://play.google.com https://enterprise.google.com; frame-ancestors 'self'";
    "~^/enrollment/android/zero-touch([?].*)?$" "base-uri 'self'; object-src 'none'; frame-src 'self' https://play.google.com https://enterprise.google.com https://accounts.google.com; frame-ancestors 'self'";
}

# Keepalive pool to the Node server: all non-WebSocket traffic reuses a small
# set of persistent upstream connections instead of opening a new TCP
# connection per request (and leaving TIME_WAIT sockets behind).
upstream obligarth_server {
    server server:3001;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression (text types only) ───────────────────────────────────────
    # The SPA is one multi-MB bundle plus the locale JSONs: on cellular (the
    # Android app) gzip cuts the first load several-fold. Binary payloads are
    # deliberately NOT listed: the APK (application/vnd.android.package-archive),
    # app packages, images and fonts are already compressed. text/html is
    # always included. gzip only applies when the client sends
    # Accept-Encoding: gzip.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Obligate SSO callback (browser redirect)
    location /auth/ {
        proxy_pass http://obligarth_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Return of Google after the signup of an Android enterprise (android-amapi
    # §6.2, AN48): its query carries the enterpriseToken and the single-use
    # signup token s. No access log here (nor in a CDN or a balancer in front:
    # give it the same rule); the server logs neither, answers no-store and
    # no-referrer, and redirects to a fixed page of the console. Every spelling
    # the server routes there (Express ignores the case and a final slash) is
    # matched here too, so none of them reaches the access log of /api/.
    location ~* ^/api/android/signup/callback/?$ {
        access_log off;
        proxy_pass http://obligarth_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # API proxy (everything under /api, /api/agent/keys included)
    location /api/ {
        proxy_pass http://obligarth_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        # A module's WebSocket (raw upgrade under /api) stays open as long as
        # its connection lives; long uploads are not cut at the 60 s default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Software-repository uploads: app packages are large. The server
        # (multer) caps at 500 MB — nginx must not reject them first with a
        # 413 (default client_max_body_size is only 1 MB). Stream large bodies
        # straight to the upstream instead of buffering the whole file first.
        client_max_body_size 512M;
        proxy_request_buffering off;
    }

    # MCP server (AI agents through personal access keys): one JSON-RPC endpoint, JSON answers only (no SSE, no
    # upgrade), bodies of 256 kB at most (the server refuses beyond too). The edge proxy (mdm.<domain>) never relays it.
    location = /mcp {
        proxy_pass http://obligarth_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 256k;
        proxy_read_timeout 120s;
    }

    # Socket.io proxy (browser real-time channel)
    location /socket.io/ {
        proxy_pass http://obligarth_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check endpoint proxy
    location /health {
        access_log off;
        proxy_pass http://obligarth_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated: it references content-hashed
    # bundles that disappear on every deploy. Without this, heuristic caching
    # (and the Android WebView's persistent HTTP cache, where there is no F5)
    # can serve a stale index.html pointing at deleted bundles → white screen.
    # `no-cache` = revalidate each time (cheap 304 via ETag/Last-Modified).
    # The try_files fallback above and the `index` directive both internally
    # redirect to /index.html, so every SPA route lands here.
    # Its Content-Security-Policy and X-Frame-Options are set here, where every page of the console is answered
    # (add_header of a location replaces those of the server block: keep them together).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $obligarth_csp always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Vite's bundles (/assets/, names carrying a content hash): cached for a year.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The files of client/public (logo.svg, favicon.svg…) keep their name from
    # one version to the next: revalidated each time (cheap 304 via ETag), or a
    # new logo would stay hidden behind a year of "immutable" cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
}

# Main nginx config — replaces the stock /etc/nginx/nginx.conf, whose events{}
# block caps worker_connections at 1024 (it can't be raised from conf.d). Every
# open browser holds a WebSocket (Socket.io) through this proxy, and a
# connection over the cap is refused rather than queued: the limits below stay
# generous until the load of the MDM is measured.

user  nginx;
worker_processes  auto;
# Each connection needs ~1-2 file descriptors. Must be >= worker_connections,
# and the container ulimit (docker-compose ulimits.nofile) must allow it.
worker_rlimit_nofile  65536;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  16384;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Per-server-block config (upstream keepalive pool, map, routing).
    include /etc/nginx/conf.d/*.conf;
}
